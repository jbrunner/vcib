replicaCount: 2

image:
  repository: ghcr.io/jbrunner/vcib
  pullPolicy: IfNotPresent
  # Defaults to .Chart.AppVersion when empty.
  tag: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # Defaults to fullname when empty.
  name: ""

config:
  # VCIB_VARNISH_NAMESPACE
  # Kubernetes namespace of the Varnish pods.
  varnishNamespace: "default"
  # VCIB_VARNISH_LABEL_SELECTOR
  # Label selector for Varnish pods.
  varnishLabelSelector: "app=varnish"
  # VCIB_VARNISH_PORT
  # Port of the Varnish instances.
  varnishPort: "6081"
  # VCIB_LISTEN_ADDR
  # Address VCIB listens on for invalidation requests.
  listenAddr: ":8080"
  # VCIB_METRICS_ADDR
  # Address for /metrics and /healthz.
  metricsAddr: ":9090"
  # VCIB_RETRY_INTERVAL
  # Wait time between retries.
  retryInterval: "10s"
  # VCIB_RETRY_COUNT
  # Number of retries per pod before marking as failed.
  retryCount: "3"
  # VCIB_REQUEST_TIMEOUT
  # HTTP timeout for a single forwarding attempt to a Varnish pod.
  requestTimeout: "5s"
  # VCIB_POD_CACHE_TTL
  # How long the Kubernetes pod list is cached before re-querying the API.
  podCacheTTL: "1s"
  # VCIB_FORWARD_HEADERS
  # Comma-separated list of request headers to forward to Varnish.
  forwardHeaders: "Host"
  # VCIB_MAX_CONCURRENT_DISPATCHES
  # Maximum number of concurrent pod dispatch goroutines.
  maxConcurrentDispatches: "500"
  # VCIB_LOG_LEVEL
  # Log level (debug, info, warn, error).
  logLevel: "info"
  # VCIB_CLIENT_AUTH
  # Kubernetes Secret reference for the Authorization header clients must send. Empty = disabled.
  # Example: { name: "vcib-secrets", key: "client-auth" }
  clientAuthSecretRef: {}
  # VCIB_VARNISH_AUTH
  # Kubernetes Secret reference for the Authorization header sent to Varnish backends. Empty = disabled.
  # Example: { name: "vcib-secrets", key: "varnish-auth" }
  varnishAuthSecretRef: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

service:
  type: ClusterIP
  port: 80
  metricsPort: 9090
  annotations: {}
  labels: {}

rbac:
  create: true

networkPolicy:
  enabled: false
  ingress:
    http:
      # Allow ingress on port 8080 (PURGE/BAN endpoint).
      enabled: true
      # List of from-peers (namespaceSelector/podSelector). Empty = from anywhere.
      from: []
    metrics:
      # Allow ingress on port 9090 (Prometheus scrape).
      enabled: true
      # List of from-peers (namespaceSelector/podSelector). Empty = from anywhere.
      from: []
  egress:
    apiServer:
      # Allow egress to the Kubernetes API server (port 443 in kube-system, port 6443 anywhere).
      enabled: true
    varnish:
      # Allow egress to Varnish pods. Port is taken from config.varnishPort.
      enabled: true
      # namespaceSelector for the Varnish namespace. Empty = same namespace.
      namespaceSelector: {}
      # podSelector for Varnish pods. Empty = any pod on that port.
      podSelector: {}

serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics
  # Additional labels to add to the ServiceMonitor (e.g. for Prometheus operator selectors).
  additionalLabels: {}
